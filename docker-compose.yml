version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: medgpt-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment below for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medgpt-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite:///./medgpt.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:80"]
    volumes:
      - backend_data:/app/uploads
      - chroma_data:/app/chroma_db
      - db_data:/app
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medgpt-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=https://medgpt-api.onrender.com
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data:
  chroma_data:
  db_data:
